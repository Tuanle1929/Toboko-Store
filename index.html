</div>

<div class="toast" id="toast"></div>

<div class="contact-fab" id="contactFab">
  <div class="fab-menu" id="fabMenu">
    <a href="https://zalo.me/0388054613" target="_blank" rel="noopener" class="fab-btn fab-zalo" aria-label="Chat Zalo">Zalo</a>
    <a href="https://m.me/TobokoStore" id="messengerBtn" data-fallback="https://m.me/TobokoStore" data-deeplink="fb-messenger://user-thread/TobokoStore" rel="noopener" class="fab-btn fab-messenger" aria-label="Chat Messenger">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
    </a>
    <a href="tel:0388054613" class="fab-btn fab-phone" aria-label="Gọi điện">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
    </a>
  </div>
  
  <button class="fab-toggle" id="fabToggle" aria-label="Liên hệ">
    <svg class="icon-chat" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>
</div>

<script>
(() => {
  "use strict";

  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyu77ZRFca0pFXZPnfwn3gISQRbXOp5x-TCDg6RKGR_beG8zargaNKB0SoqI9bwwf8/exec'; 
  const LOW_STOCK_THRESHOLD = 10; 
  const DEFAULT_VARIANT_LABEL = 'Mặc định'; 
  const SHIPPING_FEE = 20000;
  const SHIPPING_FREE_THRESHOLD = 20;

  const esc = str => String(str ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  const fmt = n => (typeof n === 'number' && !isNaN(n) ? n : 0).toLocaleString('vi-VN') + '₫';

  let state = {
    view: 'home', productId: null, selectedVariant: null, qty: 1, cart: [], products: [],          
    productsLoading: true, productsError: false, inventory: {}, lastOrderId: null,
    lastOrderShippingFee: 0, lastOrderIsFreeship: false, cartBannerQty: 0,
    descExpanded: false, tierProgressVisible: true,
    discountTiers: [
      { min: 100, max: Infinity, discount: 10000 },
      { min: 50, max: 99, discount: 7000 },
      { min: 20, max: 49, discount: 5000 },
      { min: 5, max: 19, discount: 3000 },
      { min: 1, max: 4, discount: 0 }
    ]
  };

  let _tierCollapseTimer = null;
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');

  // [HÀM MỚI] Xử lý scroll will-change tự dọn dẹp
  const setupScrollWillChange = track => {
    if (!track) return;
    let scrollTimeout;
    const activate = () => { track.style.willChange = 'scroll-position'; };
    track.addEventListener('touchstart', activate, { passive: true });
    track.addEventListener('mouseenter', activate);
    track.addEventListener('scroll', () => {
      track.style.willChange = 'scroll-position';
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => track.style.willChange = 'auto', 150);
    }, { passive: true });
  };

  const toast = msg => {
    toastEl.textContent = msg; 
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 3000); 
  };
  
  const cartTotalQty = () => state.cart.reduce((s, i) => s + i.qty, 0);
  const getDiscountByQty = qty => {
    if (qty === 0) return 0;
    const tier = state.discountTiers.find(t => qty >= t.min);
    return tier ? tier.discount : 0;
  };
  const getCurrentDiscount = () => getDiscountByQty(cartTotalQty());
  const effectivePrice = price => Math.max(0, price - getCurrentDiscount());

  const priceHTML = price => {
    const discount = getCurrentDiscount();
    return discount > 0 && price > 0 
      ? `<span class="price-old">${fmt(price)}</span><span class="price-new">${fmt(effectivePrice(price))}</span>`
      : fmt(price);
  };

  const refreshVisiblePrices = () => {
    document.querySelectorAll('[data-price-id]').forEach(el => {
      const p = findProduct(el.dataset.priceId);
      if (p) el.innerHTML = priceHTML(p.price);
    });
  };

  const cartTotal = () => state.cart.reduce((s, i) => s + (i.qty * effectivePrice(i.price)), 0);
  const getShippingFee = () => cartTotalQty() >= SHIPPING_FREE_THRESHOLD ? 0 : SHIPPING_FEE;
  const isFreeship = () => getShippingFee() === 0;
  const shippingRowHTML = (fee, free) => `
    <div class="s-row">
      <span>Phí ship (tạm tính)</span>
      <span>${free ? '<span style="color:var(--primary); font-weight:800;">Miễn phí</span>' : fmt(fee)}</span>
    </div>`;

  const tierProgressHTML = (baseQty, previewQty = 0, startWidth = '0%') => {
    const totalQty = baseQty + previewQty;
    const activeTiers = state.discountTiers.filter(t => t.discount > 0).sort((a, b) => a.min - b.min);
    let targetTier = null, prevMilestone = 0;

    for (let i = 0; i < activeTiers.length; i++) {
        if (activeTiers[i].min >= totalQty) {
            targetTier = activeTiers[i];
            prevMilestone = i > 0 ? activeTiers[i - 1].min : 0;
            break;
        }
    }

    if (!targetTier) {
      const msgMax = totalQty >= SHIPPING_FREE_THRESHOLD
        ? `🎉 Đang hưởng <b style="color:var(--primary);">Freeship</b> và mức giảm giá sỉ cao nhất!`
        : `🎉 Đang hưởng mức giảm giá sỉ cao nhất!`;
      return `
        <div class="tier-progress tier-progress-max">
          <div class="tier-progress-row"><span class="tier-progress-icon">🎉</span><span class="tier-progress-text">${msgMax}</span></div>
          <div class="tier-progress-track"><div class="tier-progress-fill" data-w="100%" style="width:${startWidth};"></div></div>
        </div>`;
    }

    const isFreeshipGoal = targetTier.min === SHIPPING_FREE_THRESHOLD;
    let msg, pct;

    if (totalQty === targetTier.min && previewQty > 0) {
        pct = 100;
        msg = isFreeshipGoal ? `Đã đủ điều kiện <b style="color:var(--primary);">Freeship</b>! Thêm vào giỏ để áp dụng.` : `Bạn đủ điều kiện giảm giá rồi! Thêm vào giỏ hàng để được áp dụng nha`;
    } else if (totalQty === targetTier.min && previewQty === 0) {
        const nextTargetIdx = activeTiers.indexOf(targetTier) + 1;
        if (nextTargetIdx < activeTiers.length) {
            const newTarget = activeTiers[nextTargetIdx];
            const needed = newTarget.min - totalQty;
            pct = 0;
            msg = newTarget.min === SHIPPING_FREE_THRESHOLD
               ? `Thêm <b>${needed}</b> sản phẩm nữa để được <b style="color:var(--primary);">Freeship</b> + giảm thêm <b>${newTarget.discount/1000}k/SP</b>!`
               : `Thêm <b>${needed}</b> sản phẩm nữa để được giảm thêm <b>${newTarget.discount/1000}k/SP</b>!`;
            targetTier = newTarget; prevMilestone = totalQty;
        } else {
             pct = 100;
             msg = isFreeshipGoal ? `Đã đủ điều kiện <b style="color:var(--primary);">Freeship</b>! Tiến hành thanh toán.` : `Đã đủ điều kiện giảm sỉ <b>${targetTier.discount/1000}k/SP</b>! Tiến hành thanh toán.`;
        }
    } else {
        const needed = targetTier.min - totalQty;
        pct = Math.max(0, Math.min(100, ((totalQty - prevMilestone) / (targetTier.min - prevMilestone)) * 100));
        
        if (totalQty === 0) {
            msg = targetTier.min === 5 ? `Mua từ <b>${targetTier.min}</b> sản phẩm để được giá sỉ` : (isFreeshipGoal ? `Mua từ <b>${targetTier.min}</b> sản phẩm để được <b style="color:var(--primary);">Freeship</b> + giảm sỉ <b>${targetTier.discount/1000}k/SP</b> toàn bộ gian hàng` : `Mua từ <b>${targetTier.min}</b> sản phẩm để được giảm sỉ <b>${targetTier.discount/1000}k/SP</b> toàn bộ gian hàng`);
        } else {
            msg = targetTier.min === 5 ? `Thêm <b>${needed}</b> sản phẩm nữa để được giá sỉ` : (isFreeshipGoal ? `Thêm <b>${needed}</b> sản phẩm nữa để được <b style="color:var(--primary);">Freeship</b> + giảm thêm <b>${targetTier.discount/1000}k/SP</b> toàn bộ gian hàng!` : `Thêm <b>${needed}</b> sản phẩm nữa để được giảm <b>${targetTier.discount/1000}k/SP</b> toàn bộ gian hàng!`);
        }
    }

    return `
      <div class="tier-progress">
        <div class="tier-progress-row"><span class="tier-progress-icon">🛒</span><span class="tier-progress-text">${msg}</span><span class="tier-progress-count">${totalQty}/${targetTier.min} SP</span></div>
        <div class="tier-progress-track"><div class="tier-progress-fill" data-w="${pct}%" style="width:${startWidth};"></div></div>
      </div>`;
  };

  const previewQty = () => cartTotalQty() + state.qty;
  const previewDiscount = () => getDiscountByQty(previewQty());
  const previewFreeship = () => previewQty() >= SHIPPING_FREE_THRESHOLD;

  const notifyPreviewMilestone = (oldDiscount, wasFreeship) => {
    const newDiscount = previewDiscount(), nowFreeship = previewFreeship();
    if (newDiscount > oldDiscount) {
      toast(nowFreeship && !wasFreeship ? `🎉 Số lượng đủ Freeship + giảm ${newDiscount/1000}k/SP! Thêm vào giỏ hàng ngay.` : `🎉 Số lượng đủ để giảm ${newDiscount/1000}k/SP! Thêm vào giỏ hàng ngay.`);
    } else if (!wasFreeship && nowFreeship) {
      toast(`🎉 Số lượng đã đủ Freeship! Thêm vào giỏ hàng ngay.`);
    }
  };

  const notifyDiscountChange = (oldDiscount, wasFreeship) => {
    const newDiscount = getCurrentDiscount(), nowFreeship = isFreeship();
    if (newDiscount > oldDiscount) {
      toast(nowFreeship && !wasFreeship ? `🎉 Tuyệt vời! Bạn được Freeship và giảm ${newDiscount/1000}k/SP!` : `🎉 Tuyệt vời, giảm ${newDiscount/1000}k cho tất cả sản phẩm!`);
    } else if (newDiscount < oldDiscount) {
      const needed = (state.discountTiers.slice().reverse().find(t => t.min > cartTotalQty() && t.discount > 0) || {}).min - cartTotalQty();
      toast(wasFreeship && !nowFreeship ? `Đã mất freeship và mốc giảm ${oldDiscount/1000}k/SP, mua thêm ${needed} SP để nhận lại ưu đãi nhé!` : `Vừa rời mốc giảm ${oldDiscount/1000}k/SP, mua thêm ${needed} SP để nhận lại nhé!`);
    } else if (wasFreeship && !nowFreeship) {
      toast(`Vừa mất ưu đãi freeship, mua thêm ${SHIPPING_FREE_THRESHOLD - cartTotalQty()} SP nữa nhé!`);
    } else if (!wasFreeship && nowFreeship) {
      toast(`🎉 Tuyệt vời, bạn vừa được Freeship cho đơn hàng này!`);
    }
  };

  const normalizeProduct = p => {
    p.price = isNaN(Number(p.price)) ? 0 : Number(p.price);
    p.variants = Array.isArray(p.variants) ? p.variants : [];
    p.tags = Array.isArray(p.tags) ? p.tags : (typeof p.tags === 'string' ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : []);
    p.totalStock = isNaN(Number(p.totalStock)) ? 0 : Number(p.totalStock);
    return p;
  };

  const cardRibbonBestsellerHTML = p => p.tags.some(t => ['bestseller', 'best seller'].includes(t.toLowerCase())) ? `<div class="ribbon-bestseller">Bestseller</div>` : '';
  const cardHotPillHTML = p => p.tags.some(t => t.toLowerCase() === 'hot') ? `<span class="tag-hot">🔥 Hot</span>` : '';

  const getProductTotalStock = p => {
    if (!p) return 0;
    if (p.totalStock > 0) return p.totalStock;
    if (p.variants.length > 0 && Object.keys(state.inventory || {}).length > 0) {
      let sum = 0, hasAny = false;
      p.variants.forEach(v => {
        const key = `${p.name}||${v}`;
        if (state.inventory[key] !== undefined) {
          hasAny = true;
          const n = parseInt(state.inventory[key], 10);
          if (!isNaN(n) && n > 0) sum += n;
        }
      });
      if (hasAny) return sum;
    }
    return p.totalStock || 0;
  };

  const isProductOutOfStock = p => !state.productsLoading && getProductTotalStock(p) <= 0;
  const cardStockInlineHTML = p => getProductTotalStock(p) <= 0 ? `<span class="card-stock-text oos">Hết hàng</span>` : `<span class="card-stock-text">SL ${getProductTotalStock(p)}</span>`;

  const fetchShopData = async () => {
    if (!WEB_APP_URL || WEB_APP_URL.includes('AKfycb...')) return false; 
    try {
      const res = await fetch(WEB_APP_URL);
      const data = await res.json();
      if (data?.inventory && typeof data.inventory === 'object' && !Array.isArray(data.inventory)) state.inventory = data.inventory;
      if (Array.isArray(data?.products)) state.products = data.products.map(normalizeProduct);
      if (Array.isArray(data?.discountTiers) && data.discountTiers.length > 0) {
        state.discountTiers = data.discountTiers.map(t => ({ min: Number(t.min) || 0, max: t.max ? Number(t.max) : Infinity, discount: Number(t.discount) || 0 })).sort((a, b) => b.min - a.min); 
      }
      refreshVisiblePrices();
      return true;
    } catch { return false; }
  };

  const loadInitialData = () => {
    history.replaceState({ view: state.view, productId: state.productId }, '', window.location.href);
    render(); 
    fetchShopData().then(ok => {
      state.productsLoading = false;
      if (!ok && !WEB_APP_URL.includes('AKfycb...')) state.productsError = true; 
      render();
    });
  };

  const findProduct = name => state.products.find(x => x.name === name);
  const variantImage = (p, v) => (p.variantImages && p.variantImages[v]) || p.image;

  const updateHeaderHeightVar = () => {
    const header = document.querySelector('header.site');
    if (header) document.documentElement.style.setProperty('--header-h', `${header.offsetHeight}px`);
  };
  window.addEventListener('resize', updateHeaderHeightVar);
  updateHeaderHeightVar();

  let _bottomPaddingRetimer = null;
  const syncDetailBottomPadding = () => {
    const detailEl = document.querySelector('.detail'), bottomBarEl = document.querySelector('.bottom-bar');
    if (!detailEl || !bottomBarEl) return;
    detailEl.style.paddingBottom = window.innerWidth <= 768 ? `${bottomBarEl.offsetHeight + 24}px` : '';
  };
  const scheduleSyncDetailBottomPadding = () => {
    syncDetailBottomPadding();
    clearTimeout(_bottomPaddingRetimer);
    _bottomPaddingRetimer = setTimeout(syncDetailBottomPadding, 350);
  };
  window.addEventListener('resize', scheduleSyncDetailBottomPadding);
  window.addEventListener('orientationchange', scheduleSyncDetailBottomPadding);

  const getStock = (productName, variantName) => {
    const n = parseInt(state.inventory[`${productName}||${variantName}`], 10);
    return isNaN(n) ? 0 : n; 
  };

  // 'main'    = popup được mở từ ảnh TRÊN (carousel chính) -> khi đóng full, cần cuộn carousel chính
  //             về đúng ảnh khách đang xem trong full (nếu popup đó đang ở chế độ carousel/lướt được).
  // 'variant' = popup được mở từ ảnh DƯỚI (ô preview phân loại) -> khi đóng full, KHÔNG đụng gì tới
  //             carousel chính hay phân loại đang chọn, giữ nguyên màn hình như trước khi mở full.
  let popupSource = null;

  // Đóng popup ảnh full: xử lý đồng bộ ảnh trên (chỉ khi popup mở từ ảnh trên và đang ở chế độ carousel)
  const closeImgPopup = () => {
    const popup = document.getElementById('imgPopup');
    const popupTrack = document.getElementById('popupTrack');

    if (popupSource === 'main' && popupTrack && popupTrack.style.display === 'flex' && popupTrack.clientWidth > 0) {
      const idx = Math.round(popupTrack.scrollLeft / popupTrack.clientWidth);
      const mainTrack = document.getElementById('mainCarousel');
      if (mainTrack) {
        mainTrack.scrollLeft = idx * mainTrack.clientWidth;
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
        const prevBtn = document.getElementById('carouselPrev');
        const nextBtn = document.getElementById('carouselNext');
        if (prevBtn && nextBtn) {
          const maxScroll = mainTrack.scrollWidth - mainTrack.clientWidth;
          prevBtn.classList.toggle('disabled', mainTrack.scrollLeft <= 4);
          nextBtn.classList.toggle('disabled', mainTrack.scrollLeft >= maxScroll - 4);
        }
      }
    }

    popup.classList.remove('show');
    document.body.style.overflow = '';
    popupSource = null;
  };

  // Bấm vào popup để đóng — bỏ qua nếu là thao tác vuốt (kéo ngón tay > 10px)
  (() => {
    const popup = document.getElementById('imgPopup');
    let touchStartX = 0, touchStartY = 0, wasDrag = false;
    popup.addEventListener('touchstart', e => {
      if (e.touches && e.touches[0]) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        wasDrag = false;
      }
    }, { passive: true });
    popup.addEventListener('touchmove', e => {
      if (e.touches && e.touches[0]) {
        const dx = Math.abs(e.touches[0].clientX - touchStartX);
        const dy = Math.abs(e.touches[0].clientY - touchStartY);
        if (dx > 10 || dy > 10) wasDrag = true;
      }
    }, { passive: true });
    popup.addEventListener('click', () => {
      if (wasDrag) { wasDrag = false; return; }
      closeImgPopup();
    });
  })();

  const updatePopupArrows = () => {
    const popupTrack = document.getElementById('popupTrack');
    const popupPrev = document.getElementById('popupPrev');
    const popupNext = document.getElementById('popupNext');
    if (!popupTrack || !popupPrev || !popupNext) return;
    const maxScroll = popupTrack.scrollWidth - popupTrack.clientWidth;
    popupPrev.classList.toggle('disabled', popupTrack.scrollLeft <= 4);
    popupNext.classList.toggle('disabled', popupTrack.scrollLeft >= maxScroll - 4);
  };

  (() => {
    const popupTrack = document.getElementById('popupTrack');
    const popupPrev = document.getElementById('popupPrev');
    const popupNext = document.getElementById('popupNext');
    if (popupTrack) popupTrack.addEventListener('scroll', updatePopupArrows);
    if (popupPrev) popupPrev.addEventListener('click', e => {
      e.stopPropagation();
      popupTrack.scrollBy({ left: -popupTrack.clientWidth, behavior: 'smooth' });
    });
    if (popupNext) popupNext.addEventListener('click', e => {
      e.stopPropagation();
      popupTrack.scrollBy({ left: popupTrack.clientWidth, behavior: 'smooth' });
    });
  })();

  const go = (view, params, pushHistory = true) => {
    document.body.style.overflow = '';
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('imgPopup').classList.remove('show');
    popupSource = null;

    state.view = view;
    clearTimeout(_tierCollapseTimer);
    if (params?.productId !== undefined) state.productId = params.productId;
    if (view === 'detail') { 
      state.selectedVariant = null; 
      state.qty = 1; 
      state.descExpanded = false; 
      state.tierProgressVisible = true; 
    }
    
    const header = document.getElementById('siteHeader'), cartBtn = document.getElementById('cartBtn');
    if (header) header.classList.toggle('sub-page', view !== 'home' && view !== 'success');
    if (cartBtn) cartBtn.style.visibility = (view === 'checkout' || view === 'success') ? 'hidden' : 'visible';

    // Thêm animation chuyển trang
    app.classList.remove('page-transition');
    void app.offsetWidth; // Trigger reflow
    app.classList.add('page-transition');

    if (pushHistory) history.pushState({ view, productId: state.productId }, '', window.location.href);
    render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.addEventListener('popstate', e => go(e.state?.view || 'home', { productId: e.state?.productId }, false));
  document.getElementById('logoHome').addEventListener('click', () => go('home'));
  document.getElementById('headerBackBtn').addEventListener('click', e => { e.preventDefault(); window.history.length > 1 ? window.history.back() : go('home'); });

  const renderHome = () => {
    let html = `
      <div class="hero"><h1>Dành cho bạn</h1><p>Hơn 300+ mã mi giả và phụ kiện làm đẹp.</p></div>
      <div class="wholesale-notice"><b>Ưu đãi giá tốt:</b> Mua càng nhiều, giá càng tốt! Từ 5 sản phẩm, bạn sẽ tự động được áp dụng giá sỉ tự động.</div>
    `;

    if (state.productsError) html += `<div class="inv-banner" style="background:#ffe6eb;color:var(--danger);">⚠️ Lỗi kết nối dữ liệu. Vui lòng tải lại trang.</div>`;
    
    if (state.productsLoading) {
      html += `
        <div style="text-align:center; padding: 60px 20px;">
          <div class="inv-dot" style="width:32px;height:32px;border-width:3px;margin:0 auto 16px;"></div>
          <div style="color:var(--text-muted); font-size:14px; font-weight: 500;">Đang tải danh sách sản phẩm...</div>
        </div>`;
    } else {
      const sortedProducts = [...state.products].sort((a, b) => isProductOutOfStock(a) - isProductOutOfStock(b));
      html += `<div class="grid">` + sortedProducts.map((p, idx) => {
        const isOOS = isProductOutOfStock(p);
        const delay = Math.min(idx * 0.05, 0.7);
        const thumbContent = p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover;">` : esc(p.emoji);
        return `
          <div class="card ${isOOS ? 'card-oos' : ''}" data-id="${esc(p.name)}" style="animation-delay: ${delay}s">
            ${cardHotPillHTML(p)}
            <div class="thumb" style="background:${esc(p.color)}">
              ${thumbContent}
              ${isOOS ? '<div class="oos-badge">Bán hết</div>' : ''}
              ${cardRibbonBestsellerHTML(p)}
            </div>
            <div class="card-body">
              <p class="name">${esc(p.name)}</p>
              <div class="card-footer-row">
                <div class="price" data-price-id="${esc(p.name)}">${priceHTML(p.price)}</div>
                ${cardStockInlineHTML(p)}
              </div>
            </div>
          </div>`;
      }).join('') + `</div>`;
    }
    app.innerHTML = html;
  };

  const renderDetail = () => {
    const p = findProduct(state.productId);
    if (!p) return go('home');

    const isSingleVariant = p.variants.length === 1 && p.variants[0] === DEFAULT_VARIANT_LABEL;
    if (isSingleVariant && !state.selectedVariant) state.selectedVariant = DEFAULT_VARIANT_LABEL;

    const maxStock = state.selectedVariant ? getStock(p.name, state.selectedVariant) : 0;
    const allOOS = !state.productsLoading && p.variants.length > 0 && p.variants.every(v => getStock(p.name, v) <= 0);
    const isOOS = isProductOutOfStock(p) || allOOS || (state.selectedVariant && maxStock <= 0);

    const imageSet = new Set();
    if (p.image) imageSet.add(p.image);
    if (p.variantImages) Object.values(p.variantImages).forEach(img => { if (img) imageSet.add(img); });
    const uniqueImages = imageSet.size ? Array.from(imageSet) : [null]; 
    const descRaw = p.desc ? String(p.desc).trim() : '';
    const isLongDesc = descRaw.length > 70 || descRaw.includes('\n');
    let descHtml = '';
    if (descRaw) {
      if (isLongDesc) {
        descHtml = `
          <div class="desc-wrap">
            <p class="desc-text ${state.descExpanded ? '' : 'clamp-2'}" id="descText">${esc(descRaw)}</p>
            <button class="desc-toggle-btn" id="descToggleBtn" type="button">${state.descExpanded ? 'Thu gọn ‹' : 'Xem thêm ›'}</button>
          </div>`;
      } else {
        descHtml = `<div class="desc-wrap"><p class="desc-text">${esc(descRaw)}</p></div>`;
      }
    }

    let html = `<div class="detail">
      <div class="carousel" style="background:${esc(p.color)}">
        <div class="carousel-track" id="mainCarousel">
          ${uniqueImages.map(img => `<div class="carousel-item">${img ? `<img src="${esc(img)}" alt="${esc(p.name)}">` : esc(p.emoji)}</div>`).join('')}
        </div>
        ${uniqueImages.length > 1 ? `
          <div class="carousel-dots">
            ${uniqueImages.map((_, idx) => `<div class="dot ${idx === 0 ? 'active' : ''}" id="dot-${idx}"></div>`).join('')}
          </div>
          <div class="carousel-arrow carousel-arrow-prev disabled" id="carouselPrev">‹</div>
          <div class="carousel-arrow carousel-arrow-next" id="carouselNext">›</div>
        ` : ''}
        ${isOOS ? `<div class="oos-badge">Bán hết</div>` : ''}
      </div>
      <div>
        <h2>${esc(p.name)}</h2>
        <div class="price-big" data-price-id="${esc(p.name)}">${priceHTML(p.price)}</div>
        ${descHtml}
    `;

    if (p.variants.length === 0 || allOOS) {
      html += `<div class="oos-block">${allOOS ? '😔 Sản phẩm này hiện tạm thời chưa thể đặt hàng. Bạn xem sản phẩm khác giúp mình nhé.' : 'Oops! Hiện không thể mua sản phẩm này rồi, bạn chọn sản phẩm khác giúp shop nha'}</div></div></div>`;
      app.innerHTML = html; return;
    }

    if (!isSingleVariant) {
      const previewImg = state.selectedVariant ? variantImage(p, state.selectedVariant) : null;
      html += `
        <div class="variant-group">
          <div class="label">Mã sản phẩm</div>
          <div class="variant-preview" id="variantPreview">
            ${previewImg ? `
              <div class="preview-thumb"><img src="${esc(previewImg)}" alt="${esc(p.name)}"></div>
              <div class="preview-text"><b>${esc(state.selectedVariant)}</b><span>Chạm để xem ảnh sản phẩm </span></div>
            ` : `<div class="preview-empty">${state.selectedVariant ? 'Mã này chưa có ảnh riêng' : 'Chọn 1 mã bên dưới để xem ảnh ngay tại đây'}</div>`}
          </div>
          <div class="pill-row">
            ${p.variants.map(v => {
              const stock = getStock(p.name, v), isOOS = stock <= 0; 
              return `<button class="pill ${state.selectedVariant === v ? 'selected' : ''}" ${isOOS ? 'disabled' : ''} data-val="${esc(v)}">${esc(v)}${isOOS ? ' (Hết)' : ''}</button>`;
            }).join('')}
          </div>
        </div>`;
    }

    if (state.selectedVariant && maxStock > 0) {
      html += `<div class="stock-info ${maxStock <= LOW_STOCK_THRESHOLD ? 'low' : ''}" style="display:inline-block; margin-bottom:20px;">Còn ${maxStock} sản phẩm</div>`;
    }

    const btnDisable = state.selectedVariant && maxStock <= 0 ? 'disabled' : '';
    const btnText = !state.selectedVariant ? 'Chọn phân loại' : (maxStock <= 0 ? 'Đã hết hàng' : 'Thêm vào giỏ hàng');

    const shouldCollapse = !isSingleVariant && !state.selectedVariant && !state.tierProgressVisible;

    if (!isSingleVariant && !state.selectedVariant && state.tierProgressVisible) {
      clearTimeout(_tierCollapseTimer);
      _tierCollapseTimer = setTimeout(() => {
        if (!state.selectedVariant && state.view === 'detail') {
          state.tierProgressVisible = false;
          const wrap = document.getElementById('tierProgressWrapper');
          if (wrap) wrap.classList.add('collapsed');
          scheduleSyncDetailBottomPadding();
        }
      }, 1500);
    }

    const oldFill = document.querySelector('.bottom-bar .tier-progress-fill');
    const startW = oldFill ? oldFill.style.width : '0%';

    html += `
      <div class="bottom-bar">
        <div class="tier-progress-wrapper ${shouldCollapse ? 'collapsed' : ''}" id="tierProgressWrapper">
          ${tierProgressHTML(cartTotalQty(), state.qty, startW)}
        </div>
        <div class="bottom-action-row">
          <div class="qty-control">
            <button id="qtyMinus" ${!state.selectedVariant ? 'disabled' : ''}>−</button>
            <input type="number" id="qtyVal" value="${state.qty}" min="1" ${!state.selectedVariant ? 'disabled' : ''}>
            <button id="qtyPlus" ${!state.selectedVariant || state.qty >= maxStock ? 'disabled' : ''}>+</button>
          </div>
          <button class="btn" id="addToCartBtn" ${btnDisable}>${btnText}</button>
        </div>
      </div></div></div>`;
    
    app.innerHTML = html;
    setTimeout(() => document.querySelectorAll('.tier-progress-fill').forEach(el => el.style.width = el.dataset.w), 10);
    scheduleSyncDetailBottomPadding();

    const wrapEl = document.getElementById('tierProgressWrapper');
    if (wrapEl) {
      wrapEl.addEventListener('transitionend', e => {
        if (e.target === wrapEl && e.propertyName === 'max-height') {
          syncDetailBottomPadding();
        }
      });
    }

    const track = document.getElementById('mainCarousel');
    // Khởi tạo scroll linh hoạt cho băng chuyền ảnh
    setupScrollWillChange(track);
    
    const updateCarouselArrows = () => {
      if (!track) return;
      const prevBtn = document.getElementById('carouselPrev'), nextBtn = document.getElementById('carouselNext');
      if (prevBtn && nextBtn) {
        prevBtn.classList.toggle('disabled', track.scrollLeft <= 4);
        nextBtn.classList.toggle('disabled', track.scrollLeft >= track.scrollWidth - track.clientWidth - 4);
      }
    };

    if (track && uniqueImages.length > 1) {
      let isScrolling;
      track.addEventListener('scroll', () => {
        window.cancelAnimationFrame(isScrolling);
        isScrolling = window.requestAnimationFrame(() => {
            const index = Math.round(track.scrollLeft / track.clientWidth);
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
            updateCarouselArrows();
        });
      }, { passive: true });
      document.getElementById('carouselPrev')?.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }));
      document.getElementById('carouselNext')?.addEventListener('click', () => track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }));
      updateCarouselArrows();
    }

    if (track && state.selectedVariant) {
      const targetImgForScroll = variantImage(p, state.selectedVariant);
      if (targetImgForScroll) {
        const targetIdx = uniqueImages.indexOf(targetImgForScroll);
        if (targetIdx > 0) {
          track.scrollLeft = targetIdx * track.clientWidth;
          document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === targetIdx));
          updateCarouselArrows();
        }
      }
    }
    // Bấm ảnh to trong Carousel:
    // Desktop: mở popup tĩnh 1 ảnh
    // Mobile: mở popup carousel đầy đủ kèm 2 nút mũi tên ‹ ›
    app.querySelectorAll('.carousel-item').forEach((item, idx) => {
      item.addEventListener('click', () => {
        popupSource = 'main';
        const popup = document.getElementById('imgPopup');
        const popupImg = document.getElementById('popupImg');
        const popupTrack = document.getElementById('popupTrack');
        const popupPrev = document.getElementById('popupPrev');
        const popupNext = document.getElementById('popupNext');

        popup.classList.add('show');
        document.body.style.overflow = 'hidden';

        if (window.matchMedia('(min-width: 769px)').matches) {
          const img = item.querySelector('img');
          if (!img) { popup.classList.remove('show'); document.body.style.overflow = ''; return; }
          popupTrack.style.display = popupPrev.style.display = popupNext.style.display = 'none';
          popupImg.style.display = '';
          popupImg.src = img.src;
        } else {
          popupImg.style.display = 'none';
          popupTrack.innerHTML = uniqueImages.map(imgUrl => `<div class="popup-item">${imgUrl ? `<img src="${esc(imgUrl)}" alt="${esc(p.name)}">` : ''}</div>`).join('');
          popupTrack.style.display = 'flex';
          const showArrows = uniqueImages.length > 1;
          popupPrev.style.display = popupNext.style.display = showArrows ? 'flex' : 'none';
          popupTrack.scrollLeft = idx * popupTrack.clientWidth;
          updatePopupArrows();
        }
      });
    });

    const previewBlock = document.getElementById('variantPreview');
    if (previewBlock && state.selectedVariant) {
      previewBlock.addEventListener('click', () => {
        const targetImg = (p.variantImages && p.variantImages[state.selectedVariant]) || p.image;
        if (!targetImg) return;

        popupSource = 'variant';
        const popup = document.getElementById('imgPopup');
        const popupImg = document.getElementById('popupImg');
        const popupTrack = document.getElementById('popupTrack');
        const popupPrev = document.getElementById('popupPrev');
        const popupNext = document.getElementById('popupNext');

        popup.classList.add('show');
        document.body.style.overflow = 'hidden';

        // Carousel full cho ảnh dưới: cho lướt qua ảnh của các phân loại khác,
        // nhưng đóng full thì KHÔNG cập nhật ảnh trên, KHÔNG đổi phân loại đang chọn.
        popupImg.style.display = 'none';
        popupTrack.innerHTML = uniqueImages.map(imgUrl => `<div class="popup-item">${imgUrl ? `<img src="${esc(imgUrl)}" alt="${esc(p.name)}">` : ''}</div>`).join('');
        popupTrack.style.display = 'flex';
        const showArrows = uniqueImages.length > 1;
        popupPrev.style.display = popupNext.style.display = showArrows ? 'flex' : 'none';

        let startIdx = uniqueImages.indexOf(targetImg);
        if (startIdx < 0) startIdx = 0;
        popupTrack.scrollLeft = startIdx * popupTrack.clientWidth;
        updatePopupArrows();
      });
    }
  };

  // Event Delegation cho #app
  app.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) {
        return go('detail', { productId: card.dataset.id });
    }

    const descToggle = e.target.closest('#descToggleBtn');
    if (descToggle) {
        const dText = document.getElementById('descText');
        if (!dText) return;
        
        state.descExpanded = !state.descExpanded;
        if (state.descExpanded) {
            const clampedH = dText.offsetHeight;
            dText.classList.remove('clamp-2');
            const fullH = dText.scrollHeight;
            dText.style.maxHeight = clampedH + 'px';
            void dText.offsetHeight;
            dText.style.maxHeight = fullH + 'px';
            setTimeout(() => { if (state.descExpanded) dText.style.maxHeight = 'none'; }, 300);
        } else {
            const fullH = dText.offsetHeight;
            dText.style.maxHeight = fullH + 'px';
            dText.classList.add('clamp-2');
            const clampedH = dText.offsetHeight;
            dText.classList.remove('clamp-2');
            void dText.offsetHeight;
            dText.style.maxHeight = clampedH + 'px';
            setTimeout(() => {
                if (!state.descExpanded) {
                    dText.classList.add('clamp-2');
                    dText.style.maxHeight = '';
                }
            }, 300);
        }
        
        descToggle.textContent = state.descExpanded ? 'Thu gọn ‹' : 'Xem thêm ›';
        scheduleSyncDetailBottomPadding();
        return;
    }

    const pill = e.target.closest('.pill');
    if (pill && !pill.hasAttribute('disabled')) {
        clearTimeout(_tierCollapseTimer);
        state.tierProgressVisible = true;
        state.selectedVariant = pill.dataset.val;
        state.qty = 1;
        return renderDetail();
    }

    const qtyBtn = e.target.closest('.qty-control button');
    if (qtyBtn && !qtyBtn.hasAttribute('disabled')) {
        const p = findProduct(state.productId);
        const maxStock = getStock(p.name, state.selectedVariant);
        const oldDiscount = previewDiscount(), wasFreeship = previewFreeship();
        
        if (qtyBtn.id === 'qtyMinus' && state.qty > 1) state.qty--;
        else if (qtyBtn.id === 'qtyPlus') {
            if (state.qty < maxStock) state.qty++;
            else return toast(`Dạ kho chỉ còn tối đa ${maxStock} sản phẩm thôi ạ`);
        }
        renderDetail();
        if (qtyBtn.id === 'qtyPlus') notifyPreviewMilestone(oldDiscount, wasFreeship);
        return;
    }

    const addToCartBtn = e.target.closest('#addToCartBtn');
    if (addToCartBtn && !addToCartBtn.hasAttribute('disabled')) {
        if (!state.selectedVariant) {
            const variantGroup = document.querySelector('.variant-group');
            if (variantGroup) {
                variantGroup.scrollIntoView({ behavior: 'smooth', block: 'center' });
                variantGroup.classList.remove('pulse-highlight');
                void variantGroup.offsetWidth;
                variantGroup.classList.add('pulse-highlight');
                toast('Chọn phân loại để thêm vào giỏ hàng nha');
            }
            return;
        }
        const p = findProduct(state.productId);
        const key = `${p.name}|${state.selectedVariant}`;
        const existing = state.cart.find(i => i.key === key);
        const currentCartQty = existing ? existing.qty : 0;
        const maxStock = getStock(p.name, state.selectedVariant);

        if (currentCartQty + state.qty > maxStock) return toast(`Giỏ hàng đã có ${currentCartQty} sản phẩm này rồi, kho chỉ còn ${maxStock} thôi ạ`);

        const oldDiscount = getCurrentDiscount(), wasFreeship = isFreeship();
        const finalImg = (p.variantImages && p.variantImages[state.selectedVariant]) || p.image;

        if (existing) existing.qty += state.qty;
        else state.cart.push({ key, productId: p.name, name: p.name, emoji: p.emoji, color: p.color, image: finalImg, price: p.price, variant: state.selectedVariant, qty: state.qty });

        state.qty = 1;
        state.cartBannerQty = cartTotalQty();
        updateCartBadge(); 

        const cartBtn = document.getElementById('cartBtn');
        if (cartBtn) {
            cartBtn.classList.remove('bump');
            void cartBtn.offsetWidth; 
            cartBtn.classList.add('bump');
        } 
        
        const newDiscount = getCurrentDiscount(), nowFreeship = isFreeship();
        if (newDiscount > oldDiscount) {
          toast(nowFreeship && !wasFreeship ? `🎉 Tuyệt vời! Bạn được Freeship và giảm ${newDiscount/1000}K/SP!` : `🎉 Tuyệt vời, giảm ${newDiscount/1000}K toàn bộ gian hàng!`);
        } else if (!wasFreeship && nowFreeship) {
          toast(`🎉 Tuyệt vời, bạn vừa được Freeship cho đơn hàng này!`);
        } else toast('Đã thêm vào giỏ hàng');
        
        return renderDetail();
    }
  });

  app.addEventListener('change', e => {
      if (e.target.id === 'qtyVal') {
          const p = findProduct(state.productId);
          const maxStock = getStock(p.name, state.selectedVariant);
          let val = parseInt(e.target.value, 10);
          if (isNaN(val) || val < 1) val = 1;
          if (val > maxStock) { val = maxStock; toast(`Dạ kho chỉ còn tối đa ${maxStock} sản phẩm thôi ạ`); }
          const oldDiscount = previewDiscount(), wasFreeship = previewFreeship();
          state.qty = val;
          renderDetail();
          notifyPreviewMilestone(oldDiscount, wasFreeship);
      }
  });

  // ---------- Giỏ hàng (Drawer) ----------
  const drawer = document.getElementById('drawer');
  drawer.addEventListener('transitionend', e => {
      // Trả lại bộ nhớ sau khi hiệu ứng mở/đóng hoàn tất
      if (e.target === drawer) drawer.style.willChange = 'auto';
  });

  const openDrawer = () => {
    state.cartBannerQty = cartTotalQty();
    renderDrawer(); 
    
    // Bật compositor layer để animate
    drawer.style.willChange = 'transform';
    requestAnimationFrame(() => {
        document.getElementById('overlay').classList.add('open'); 
        drawer.classList.add('open');
        document.body.style.overflow = 'hidden'; 
    });
    fetchShopData().then(ok => { if (ok && document.getElementById('drawer').classList.contains('open')) renderDrawer(); });
  };

  const closeDrawer = () => { 
    // Bật lại compositor layer để đóng
    drawer.style.willChange = 'transform';
    requestAnimationFrame(() => {
        document.getElementById('overlay').classList.remove('open'); 
        drawer.classList.remove('open'); 
        document.body.style.overflow = '';
    });
    if (state.view === 'detail') renderDetail();
  };

  document.getElementById('cartBtn').addEventListener('click', openDrawer);
  document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
  document.getElementById('overlay').addEventListener('click', closeDrawer);

  const renderDrawer = () => {
    const drawerBody = document.getElementById('drawerBody'), drawerFoot = document.getElementById('drawerFoot');
    if (state.cart.length === 0) {
      drawerBody.innerHTML = `<div style="text-align:center; padding: 60px 20px; color:var(--text-muted);"><div style="font-size:48px; margin-bottom:10px;">🛒</div>Giỏ hàng trống</div>`;
      drawerFoot.innerHTML = ''; return;
    }

    const oldFill = document.querySelector('#drawerBody .tier-progress-fill');
    const startW = oldFill ? oldFill.style.width : '0%';
    drawerBody.innerHTML = tierProgressHTML(state.cartBannerQty, 0, startW) + state.cart.map(item => {
      const thumbContent = item.image ? `<img src="${esc(item.image)}" style="width:100%;height:100%;object-fit:cover;">` : esc(item.emoji);
      const maxStock = getStock(item.name, item.variant);
      const finalLineTotal = effectivePrice(item.price);
      const priceHtml = finalLineTotal < item.price 
        ? `<div style="text-align:right;"><div class="price-old" style="font-size:11.5px; margin-right:0; display:block;">${fmt(item.price)}</div><span class="ci-price">${fmt(finalLineTotal)}</span></div>`
        : `<span class="ci-price">${fmt(finalLineTotal)}</span>`;

      return `
        <div class="cart-item" data-key="${esc(item.key)}">
          <div class="thumb-sm" style="background:${esc(item.color)}">${thumbContent}</div>
          <div class="ci-info">
            <p class="ci-name">${esc(item.name)}</p>
            <p class="ci-variant">${item.variant === DEFAULT_VARIANT_LABEL ? '' : esc(item.variant)}</p>
            <div class="ci-row">
              <div class="mini-qty">
                <button class="mq-minus">−</button>
                <input type="number" class="mq-input" value="${item.qty}" min="1">
                <button class="mq-plus" ${item.qty >= maxStock ? 'disabled' : ''}>+</button>
              </div>
              ${priceHtml}
            </div>
            <button class="remove-btn">Xóa</button>
          </div>
        </div>`;
    }).join('');
    setTimeout(() => document.querySelectorAll('.tier-progress-fill').forEach(el => el.style.width = el.dataset.w), 10);
    
    const rawSubtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
    const finalTotal = cartTotal(), discountTotal = rawSubtotal - finalTotal, shippingFee = getShippingFee();
    
    drawerFoot.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; color:var(--text);"><span>Tạm tính</span><span>${fmt(rawSubtotal)}</span></div>
      ${discountTotal > 0 ? `<div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; color:var(--text);"><span>Giảm giá sỉ</span><span>- ${fmt(discountTotal)}</span></div>` : ''}
      <div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; color:var(--text);"><span>Phí ship (tạm tính)</span><span>${isFreeship() ? '<span style="color:var(--primary); font-weight:800;">Miễn phí</span>' : fmt(shippingFee)}</span></div>
      <div style="display:flex; justify-content:space-between; font-weight:800; font-size:17px; margin-bottom:14px; border-top:1px dashed var(--border); padding-top:10px;"><span>Tổng thanh toán</span><span style="color:var(--primary);">${fmt(finalTotal + shippingFee)}</span></div>
      <button class="btn block" id="checkoutBtn" style="width:100%">Tiếp tục thanh toán</button>
    `;
  };

  document.getElementById('drawerBody').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const row = btn.closest('.cart-item');
      if (!row) return;
      
      const key = row.dataset.key;
      const item = state.cart.find(i => i.key === key);
      const maxStock = getStock(item.name, item.variant);
      const oldDiscount = getCurrentDiscount(), wasFreeship = isFreeship();

      if (btn.classList.contains('mq-plus')) {
          if (item.qty < maxStock) item.qty++;
          else return toast(`Dạ kho chỉ còn tối đa ${maxStock} sản phẩm thôi ạ`);
      } else if (btn.classList.contains('mq-minus')) {
          item.qty--;
          if (item.qty <= 0) state.cart = state.cart.filter(i => i.key !== key);
      } else if (btn.classList.contains('remove-btn')) {
          state.cart = state.cart.filter(i => i.key !== key);
      }
      
      state.cartBannerQty = cartTotalQty();
      updateCartBadge();
      renderDrawer();
      notifyDiscountChange(oldDiscount, wasFreeship);
  });

  document.getElementById('drawerBody').addEventListener('change', e => {
      if (e.target.classList.contains('mq-input')) {
          const row = e.target.closest('.cart-item');
          const item = state.cart.find(i => i.key === row.dataset.key);
          const maxStock = getStock(item.name, item.variant);
          const oldDiscount = getCurrentDiscount(), wasFreeship = isFreeship();
          
          let val = parseInt(e.target.value, 10);
          if (isNaN(val) || val < 1) val = 1;
          if (val > maxStock) { val = maxStock; toast(`Dạ kho chỉ còn tối đa ${maxStock} sản phẩm thôi ạ`); }
          
          item.qty = val;
          state.cartBannerQty = cartTotalQty();
          updateCartBadge();
          renderDrawer();
          notifyDiscountChange(oldDiscount, wasFreeship);
      }
  });

  document.getElementById('drawerFoot').addEventListener('click', e => {
      if (e.target.id === 'checkoutBtn') { closeDrawer(); go('checkout'); }
  });

  // ---------- Thanh Toán ----------
  const renderCheckout = () => {
    if (state.cart.length === 0) return go('home');
    let rawSubtotal = 0;
    
    let html = `
      <div class="checkout-form">
        <h2 style="margin-top:0; font-size: 20px;">Xác nhận đơn hàng</h2>
        <div class="summary-box">
          ${state.cart.map(i => {
            const finalLineTotal = effectivePrice(i.price);
            rawSubtotal += i.price * i.qty;
            return `
              <div class="s-row">
                <div style="padding-right:12px;">
                  <div style="font-weight:600; line-height:1.4;">${esc(i.name)}</div>
                  ${i.variant !== DEFAULT_VARIANT_LABEL ? `<span class="s-variant">Phân loại: ${esc(i.variant)}</span>` : ''}
                </div>
                <div style="text-align:right; flex-shrink:0;">
                  <div style="font-size:13px;">${finalLineTotal < i.price ? `<span class="price-old">${fmt(i.price)}</span><span style="color:var(--text); font-weight:700;">${fmt(finalLineTotal)}</span>` : `<span style="color:var(--text); font-weight:700;">${fmt(finalLineTotal)}</span>`}</div>
                  <div style="font-weight:700; margin-top:3px;">x${i.qty}</div>
                </div>
              </div>`;
          }).join('')}
          <div style="border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 12px;"></div>
          <div class="s-row"><span>Tạm tính</span><span>${fmt(rawSubtotal)}</span></div>
          ${rawSubtotal - cartTotal() > 0 ? `<div class="s-row" style="color:var(--text);"><span>Giảm giá sỉ</span><span>- ${fmt(rawSubtotal - cartTotal())}</span></div>` : ''}
          ${shippingRowHTML(getShippingFee(), isFreeship())}
          <div class="s-row s-total"><span>Tổng thanh toán</span><span>${fmt(cartTotal() + getShippingFee())}</span></div>
        </div>
        <div class="field"><label>Họ và tên *</label><input type="text" id="fName" placeholder="Tên người nhận"></div>
        <div class="field"><label>Số điện thoại *</label><input type="tel" id="fPhone" placeholder="09xx xxx xxx"></div>
        <div class="field"><label>Địa chỉ nhận hàng *</label><input type="text" id="fAddress" placeholder="Số nhà, Phường, Quận, TP..."></div>
        <div class="field"><label>Ghi chú (Tùy chọn)</label><textarea id="fNote" rows="2" placeholder="Giao giờ hành chính..."></textarea></div>
        <button class="btn block" id="submitOrderBtn" style="margin-top:8px;">Hoàn tất đặt hàng</button>
      </div>`;
    app.innerHTML = html;
  };

  app.addEventListener('click', e => {
      if (e.target.id === 'submitOrderBtn') {
          const btn = e.target;
          const n = document.getElementById('fName').value.trim(), p = document.getElementById('fPhone').value.trim(), a = document.getElementById('fAddress').value.trim();
          if (!n || !p || !a) return toast('Bạn điền giúp mình đủ các thông tin bắt buộc nhé');
          const phoneDigits = p.replace(/[\s.\-]/g, ''); 
          if (!/^0\d{9}$/.test(phoneDigits)) return toast('Bạn điền sai SĐT rồi! kiểm tra lại giúp shop nhe!');
          
          btn.disabled = true; btn.textContent = 'Đang kiểm tra tồn kho...';
          
          fetchShopData().then(ok => {
            if (!ok && !WEB_APP_URL.includes('AKfycb...')) { btn.disabled = false; btn.textContent = 'Hoàn tất đặt hàng'; return toast('Ops! Mạng lag rùi hông load được, bạn thông cảm giúp shop nha'); }
            
            let adjusted = [], removed = [];
            state.cart.forEach(item => {
              const freshStock = getStock(item.name, item.variant);
              if (freshStock <= 0) removed.push(`${item.name}${item.variant === DEFAULT_VARIANT_LABEL ? '' : ` (${item.variant})`}`);
              else if (item.qty > freshStock) { item.qty = freshStock; adjusted.push(`${item.name}${item.variant === DEFAULT_VARIANT_LABEL ? '' : ` (${item.variant})`}`); }
            });
            
            if (removed.length) state.cart = state.cart.filter(i => getStock(i.name, i.variant) > 0);
            if (removed.length || adjusted.length) {
              btn.disabled = false; btn.textContent = 'Hoàn tất đặt hàng'; 
              updateCartBadge(); 
              toast('Ops! Đơn hàng có bạn khác vừa mua mất rồi, bạn mua sản phẩm khác nha'); 
              return renderCheckout();
            }
            
            btn.textContent = 'Đang xử lý...';
            const orderId = 'TBK' + Date.now().toString(36).toUpperCase();
            const orderedItems = state.cart.map(i => ({ name: i.name, variant: i.variant, qty: i.qty, price: i.price, finalPrice: effectivePrice(i.price) }));
            const shippingFeeAtOrder = getShippingFee(), isFreeshipAtOrder = isFreeship();
            
            fetch(WEB_APP_URL, {
              method: 'POST', body: JSON.stringify({ orderId, customerName: n, phone: phoneDigits, address: a, note: document.getElementById('fNote').value, items: orderedItems, total: cartTotal(), shippingStatus: isFreeshipAtOrder ? 'Freeship' : 'Khách trả ship', shippingFee: shippingFeeAtOrder, createdAt: new Date().toLocaleString('vi-VN') })
            }).then(res => res.json()).then(result => {
                if (!result?.success) throw new Error(result?.error || 'Server từ chối đơn hàng');
                state.lastOrderId = orderId; state.lastOrderItems = orderedItems; state.lastOrderTotal = cartTotal();
                state.lastOrderShippingFee = shippingFeeAtOrder; state.lastOrderIsFreeship = isFreeshipAtOrder;
                state.cart = []; updateCartBadge(); go('success');
            }).catch(() => { btn.disabled = false; btn.textContent = 'Hoàn tất đặt hàng'; toast('Đặt hàng chưa thành công, bạn thử lại giúp mình nhé 🙏'); });
          });
      }
  });

  const renderSuccess = () => {
    let rawSubtotal = 0;
    const itemsHtml = (state.lastOrderItems || []).map(i => {
      const finalLineTotal = i.finalPrice;
      rawSubtotal += i.price * i.qty;
      return `
        <div class="s-row">
          <div style="padding-right:12px;"><div style="font-weight:600; line-height:1.4;">${esc(i.name)}</div>${i.variant !== DEFAULT_VARIANT_LABEL ? `<div style="font-size:12px; color:var(--text-muted); margin-top:2px;">Phân loại: ${esc(i.variant)}</div>` : ''}</div>
          <div style="text-align:right; flex-shrink:0;">
            <div style="font-size:13px;">${finalLineTotal < i.price ? `<span class="price-old">${fmt(i.price)}</span><span style="color:var(--text); font-weight:700;">${fmt(finalLineTotal)}</span>` : `<span style="color:var(--text); font-weight:700;">${fmt(finalLineTotal)}</span>`}</div>
            <div style="font-weight:700; margin-top:3px;">x${i.qty}</div>
          </div>
        </div>`;
    }).join('');

    const grandTotal = (state.lastOrderTotal || 0) + (state.lastOrderShippingFee || 0);

    let summaryHtml = '';
    if (itemsHtml) {
      summaryHtml = `
        <div class="summary-box" style="text-align:left; margin: 0 0 20px;">
          ${itemsHtml}
          <div style="border-top: 1px dashed var(--border); margin-top: 12px; padding-top: 12px;"></div>
          <div class="s-row"><span>Tạm tính</span><span>${fmt(rawSubtotal)}</span></div>
          ${rawSubtotal - state.lastOrderTotal > 0 ? `<div class="s-row" style="color:var(--text);"><span>Giảm giá sỉ</span><span>- ${fmt(rawSubtotal - state.lastOrderTotal)}</span></div>` : ''}
          ${shippingRowHTML(state.lastOrderShippingFee || 0, state.lastOrderIsFreeship)}
          <div class="s-row s-total"><span>Tổng thanh toán</span><span>${fmt(grandTotal)}</span></div>
        </div>`;
    }
    
    app.innerHTML = `
      <div style="text-align:center; padding: 40px 20px; background:var(--surface); border-radius:var(--radius-lg); max-width: 480px; margin: 0 auto; box-shadow:var(--shadow-sm);">
        <div style="font-size:54px; margin-bottom:12px;">🎉</div>
        <h2 style="margin:0 0 12px;">Đặt hàng thành công!</h2>
        <p style="color:var(--text-muted); margin:0 0 8px; font-size:14px;">Mã đơn hàng của bạn:</p>
        <div style="display:inline-flex; align-items:center; gap:8px; background:var(--surface-2); padding: 8px 16px; border-radius: 999px; margin-bottom:20px;">
          <span style="color:var(--primary); font-size: 16px; font-weight:800;">${esc(state.lastOrderId)}</span>
          <button id="copyOrderBtn" style="border:none; background:none; color:var(--text-muted); padding:2px; display:flex; align-items:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
        ${summaryHtml}
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:24px;">Toboko Store sẽ sớm liên hệ bạn để xác nhận đơn. Bạn có thể gửi mã đơn qua Messenger hoặc Zalo để được xử lý nhanh hơn nha.</p>
        <button class="btn btn-outline" id="continueBtn" style="margin-bottom: 12px;">Quay về trang chủ</button>
      </div>`;
    
    document.getElementById('continueBtn').addEventListener('click', () => go('home'));
    document.getElementById('copyOrderBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(state.lastOrderId)
        .then(() => toast(`Đã sao chép mã đơn hàng: ${state.lastOrderId}`))
        .catch(() => toast('Bạn chạm giữ để tự sao chép mã đơn giúp mình nhé'));
    });
  };

  const render = () => {
    ({ home: renderHome, detail: renderDetail, checkout: renderCheckout, success: renderSuccess })[state.view]?.();
    document.getElementById('contactFab').classList.toggle('show', ['home', 'success'].includes(state.view));
  };

  const updateCartBadge = () => {
    const c = cartTotalQty(), b = document.getElementById('cartBadge');
    b.style.display = c > 0 ? 'flex' : 'none';
    if (c > 0) b.textContent = c;
    refreshVisiblePrices(); 
  };

  // FAB 
  const fabToggleBtn = document.getElementById('fabToggle'), fabMenu = document.getElementById('fabMenu');
  if (fabToggleBtn && fabMenu) {
    fabToggleBtn.addEventListener('click', e => { e.stopPropagation(); fabMenu.classList.toggle('open'); fabToggleBtn.classList.toggle('active'); });
    document.addEventListener('click', e => {
      if (fabMenu.classList.contains('open') && !fabMenu.contains(e.target) && !fabToggleBtn.contains(e.target)) {
        fabMenu.classList.remove('open'); fabToggleBtn.classList.remove('active');
      }
    });
  }

  // Messenger fallback
  const messengerBtn = document.getElementById('messengerBtn') || document.querySelector('.fab-messenger');
  if (messengerBtn) {
    messengerBtn.addEventListener('click', e => {
      e.preventDefault();
      const fallbackUrl = messengerBtn.dataset.fallback || 'https://m.me/TobokoStore';
      const deepLink = messengerBtn.dataset.deeplink || 'fb-messenger://user-thread/TobokoStore';
      if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) return window.open(fallbackUrl, '_blank');

      let fallbackTimer = null, didLeave = false;
      const cancelFallback = () => { didLeave = true; clearTimeout(fallbackTimer); document.removeEventListener('visibilitychange', cancelFallback); window.removeEventListener('pagehide', cancelFallback); };
      document.addEventListener('visibilitychange', () => document.hidden && cancelFallback());
      window.addEventListener('pagehide', cancelFallback);
      fallbackTimer = setTimeout(() => !didLeave && (window.location.href = fallbackUrl), 1000);
      window.location.href = deepLink;
    });
  }

  loadInitialData();
})();
</script>
</body>
</html>
